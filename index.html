<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toby Redshaw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-900:#0a1a2e;--navy-800:#0d1f35;--navy-700:#112844;--navy-600:#16324f;--navy-500:#1d3c5e;
      --seafoam-400:#3ecfb2;--seafoam-500:#2fb89c;--seafoam-300:#6adcc4;--seafoam-glow:rgba(62,207,178,0.18);
      --cream-50:#f5f1e8;--cream-100:#f0ebe2;--cream-200:#d9d3c6;
      --muted-400:#8a93a4;--muted-500:#6b7280;--muted-600:#4b5563;
      --coral-400:#ff6b5b;--coral-500:#e85948;--coral-300:#ff8a7a;
      --bg:var(--navy-800);--bg-elevated:var(--navy-700);--bg-hover:var(--navy-600);
      --fg:var(--cream-100);--fg-bright:var(--cream-50);--fg-muted:var(--muted-500);--fg-faint:var(--muted-600);
      --accent:var(--seafoam-400);--accent-hover:var(--seafoam-300);--accent-press:var(--seafoam-500);--accent-soft:var(--seafoam-glow);
      --secondary-accent:var(--coral-400);
      --border:rgba(240,235,226,0.08);--border-strong:rgba(240,235,226,0.16);--border-accent:var(--seafoam-400);
      --font-display:'Fraunces','Times New Roman',Georgia,serif;
      --font-body:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --font-mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
      --fs-xs:12px;--fs-sm:14px;--fs-base:16px;--fs-md:18px;--fs-lg:22px;--fs-xl:28px;--fs-2xl:38px;--fs-3xl:52px;--fs-4xl:72px;--fs-5xl:96px;--fs-6xl:128px;
      --lh-tight:1.05;--lh-snug:1.25;--lh-body:1.9;--lh-prose:1.7;
      --tracking-mono:0.12em;--tracking-display:-0.02em;--tracking-tight:-0.01em;
      --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-6:24px;--s-8:32px;--s-10:40px;--s-12:48px;--s-16:64px;--s-20:80px;--s-24:96px;--s-32:128px;
      --r-sm:2px;--r-md:4px;--r-lg:12px;--r-pill:999px;
      --shadow-1:0 2px 4px rgba(0,0,0,0.45);--shadow-2:0 8px 24px rgba(0,0,0,0.55);--shadow-3:0 20px 56px rgba(0,0,0,0.7);--shadow-accent:0 0 24px var(--accent-soft);--inset-hairline:inset 0 1px 0 rgba(240,235,226,0.04);
      --ease-out-soft:cubic-bezier(0.22,0.61,0.36,1);--ease-out-quart:cubic-bezier(0.165,0.84,0.44,1);--ease-in-out:cubic-bezier(0.65,0,0.35,1);--ease-funky:cubic-bezier(0.34,1.56,0.64,1);
      --dur-quick:120ms;--dur-base:240ms;--dur-slow:480ms;--dur-reveal:720ms;--dur-tide:12s;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-weight: 300; line-height: var(--lh-body); cursor: none; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    .tide { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(60% 50% at 18% 28%, rgba(62,207,178,0.055), transparent 60%), radial-gradient(70% 65% at 82% 72%, rgba(22,50,79,0.55), transparent 60%), var(--bg); animation: tide var(--dur-tide) ease-in-out infinite alternate; }
    @keyframes tide { 0% { opacity: 1; } 100% { opacity: 0.85; } }
    .grain { position: fixed; inset: -50%; z-index: 1; pointer-events: none; background: url('assets/grain.svg') repeat; background-size: 200px 200px; opacity: 0.055; mix-blend-mode: overlay; animation: grainShift 0.8s steps(6) infinite; }
    @keyframes grainShift { 0%{transform:translate(0,0)}16%{transform:translate(-4%,-2%)}33%{transform:translate(3%,4%)}50%{transform:translate(-3%,1%)}66%{transform:translate(2%,-3%)}83%{transform:translate(-1%,2%)} }
    .cursor-dot { position: fixed; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); transition: width 110ms ease, height 110ms ease, background 110ms ease, border 110ms ease; border: 0px solid transparent; }
    .cursor-dot.large { width: 22px; height: 22px; background: transparent; border: 2px solid var(--accent); }
    .page { position: relative; z-index: 2; margin-left: 56px; }
    section { padding: 96px 52px 80px; }
    .sect-label { font-family: var(--font-mono); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: var(--tracking-mono); color: var(--accent); margin-bottom: 24px; display: flex; align-items: center; gap: 18px; }
    .sect-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .reveal { opacity: 0; transform: translateY(16px); transition: opacity var(--dur-reveal) var(--ease-out-quart), transform var(--dur-reveal) var(--ease-out-quart); }
    .reveal.shown { opacity: 1; transform: none; }
    .d1 { transition-delay: 80ms; } .d2 { transition-delay: 160ms; } .d3 { transition-delay: 240ms; }
    .project-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--r-md); padding: 24px 22px; position: relative; overflow: hidden; transition: border-color var(--dur-base); cursor: default; }
    .project-card::before { content: ''; position: absolute; top: 0; left: 0; width: 0; height: 2px; background: var(--accent); transition: width 0.32s var(--ease-out-quart); }
    .project-card:hover::before { width: 100%; }
    .project-card:hover { border-color: var(--border-strong); }
    .post-row { display: flex; align-items: baseline; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: default; }
    .post-row:hover .post-date { color: var(--accent); }
    .post-row:hover .post-title { color: var(--fg-bright); }
    .post-date { font-family: var(--font-mono); font-size: 10px; color: var(--fg-faint); width: 86px; flex-shrink: 0; transition: color var(--dur-base); letter-spacing: 0.06em; }
    .post-title { font-family: var(--font-display); font-weight: 300; font-size: var(--fs-xl); color: var(--fg); line-height: var(--lh-snug); transition: color var(--dur-base); }
    .contact-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border: 1px solid var(--border); border-radius: var(--r-md); margin-bottom: 8px; cursor: default; position: relative; overflow: hidden; transition: border-color var(--dur-base), background var(--dur-base); }
    .contact-row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); transform: scaleY(0); transform-origin: top; transition: transform 0.13s ease-out; }
    .contact-row:hover { border-color: var(--border-strong); background: var(--bg-elevated); }
    .contact-row:hover::before { transform: scaleY(1); }
    .contact-row:hover .c-arrow { transform: rotate(45deg) translate(1px,-1px); color: var(--accent); }
    .c-arrow { transition: transform 0.1s cubic-bezier(0.34,1.56,0.64,1), color var(--dur-base); color: var(--fg-muted); font-size: 14px; }
    * { scrollbar-width: thin; scrollbar-color: var(--accent) var(--bg); }
    *::-webkit-scrollbar { width: 6px; } *::-webkit-scrollbar-track { background: var(--bg); } *::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 999px; }
  </style>
</head>
<body>
<div class="tide"></div>
<div class="grain"></div>
<div id="cursor" class="cursor-dot"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const SECTIONS = [
  { id:'hero',       label:'Hero',       num:'01' },
  { id:'about',      label:'About',      num:'02' },
  { id:'projects',   label:'Projects',   num:'03' },
  { id:'experience', label:'Experience', num:'04' },
  { id:'writing',    label:'Writing',    num:'05' },
  { id:'now',        label:'Now',        num:'06' },
  { id:'contact',    label:'Contact',    num:'07' },
];

// ── Sidebar nav ───────────────────────────────────────────────────────────────
function SidebarNav() {
  const [scrolled, setScrolled] = useState(false);
  const [active, setActive] = useState('hero');
  useEffect(() => {
    const onScroll = () => {
      setScrolled(window.scrollY > 80);
      let cur = 'hero';
      for (const s of SECTIONS) {
        const el = document.getElementById(s.id);
        if (el && el.getBoundingClientRect().top < window.innerHeight * 0.45) cur = s.id;
      }
      setActive(cur);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const go = (id) => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.offsetTop - 28, behavior: 'smooth' }); };
  return (
    <nav style={{ position:'fixed', left:0, top:0, bottom:0, width:56, display:'flex', flexDirection:'column', alignItems:'center', padding:'22px 0', borderRight:'1px solid rgba(240,235,226,0.06)', zIndex:100, gap:0 }}>
      <button onClick={() => go('hero')} style={{ background:'none', border:'none', cursor:'none', marginBottom:26, padding:0 }}>
        {scrolled ? (
          <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, fontWeight:500, letterSpacing:'0.2em', color:'var(--fg-bright)' }}>T<span style={{ color:'var(--accent)' }}>·</span>R</span>
        ) : (
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:7, fontWeight:500, letterSpacing:'0.18em', color:'var(--fg-bright)', lineHeight:1.5, display:'flex', flexDirection:'column', alignItems:'center', textTransform:'uppercase' }}>
            <span>TOBY</span>
            <span style={{ color:'var(--accent)', lineHeight:0.5, fontSize:6.5 }}>·</span>
            <span>REDSHAW</span>
          </div>
        )}
      </button>
      <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:9, flex:1, justifyContent:'center' }}>
        {SECTIONS.map(s => {
          const on = active === s.id;
          return (
            <button key={s.id} onClick={() => go(s.id)} title={s.label} style={{ background:'none', border:'none', cursor:'none', padding:'2px 0', display:'flex', flexDirection:'column', alignItems:'center', gap:2 }}>
              <div style={{ width: on?7:5, height: on?7:5, borderRadius:'50%', background: on?'var(--accent)':'transparent', border:`1px solid ${on?'var(--accent)':'rgba(240,235,226,0.18)'}`, boxShadow: on?'0 0 0 3px rgba(62,207,178,0.14)':'none', transition:'all 0.22s cubic-bezier(0.34,1.56,0.64,1)' }} />
              <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:6, letterSpacing:'0.12em', color: on?'var(--accent)':'rgba(240,235,226,0.14)', transition:'color 0.2s' }}>{s.num}</span>
            </button>
          );
        })}
      </div>
    </nav>
  );
}

// ── Terminal overlay ──────────────────────────────────────────────────────────
const TCMDS = {
  help:['Available commands:','  about · projects · experience · now · contact · blog · clear · exit'],
  about:['Trained as an economist. Mostly writes Python now.','MSc Economics, Imperial College London.','Spent the last year between London and a 70.3 in May.','','Builds things, breaks things, learns from both.'],
  projects:['Lab2Launch ——— IN PROGRESS · 2026','  Turns university research into companies.','','Eddy ——————— SHIPPED · 2024','  Forecasting tool. Cut a six-hour report to forty minutes.','','MIA Dissertation — RESEARCH · 2023','  On forecasting under uncertainty.'],
  experience:['Senior BA  ——  Accenture  · 2023–now','Analyst    ——  Co-op      · 2021–23','Economist  ——  HMRC       · 2019–21'],
  now:['Location  · London','Training  · 70.3 triathlon, Sep 2026','Reading   · ask me','Building  · something new'],
  contact:["Email's the fastest.",'','toby@redshaw.me','linkedin.com/in/tobyredshaw'],
  blog:['On forecasting under uncertainty     · 2026-04-12','Three months of training, one DNF   · 2026-03-08','What makes a good brief?            · 2026-01-22'],
};
function Terminal() {
  const [open, setOpen] = useState(false);
  const [input, setInput] = useState('');
  const [hist, setHist] = useState([]);
  const inputRef = useRef(null);
  const outRef = useRef(null);
  useEffect(() => {
    const onKey = e => {
      if (e.key === '/' && !open && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) { e.preventDefault(); setOpen(true); }
      if (e.key === 'Escape') setOpen(false);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open]);
  useEffect(() => { if (open) { setTimeout(() => inputRef.current?.focus(), 80); if (!hist.length) setHist([{ s:true, t:"toby@portfolio — type 'help' to explore" }]); } }, [open]);
  useEffect(() => { if (outRef.current) outRef.current.scrollTop = outRef.current.scrollHeight; }, [hist]);
  const run = cmd => {
    const k = cmd.trim().toLowerCase();
    if (!k) return;
    if (k === 'clear') { setHist([]); setInput(''); return; }
    if (k === 'exit') { setOpen(false); setInput(''); return; }
    const res = TCMDS[k] ? TCMDS[k].map(t => ({ t })) : [{ e:true, t:`command not found: ${cmd}  (try 'help')` }];
    setHist(h => [...h, { p:true, t:cmd }, ...res, { t:'' }]);
    setInput('');
  };
  if (!open) return (
    <div style={{ position:'fixed', bottom:18, left:'50%', transform:'translateX(-50%)', zIndex:200, pointerEvents:'none' }}>
      <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, color:'rgba(240,235,226,0.14)', letterSpacing:'0.14em', textTransform:'uppercase' }}>press / to open terminal</span>
    </div>
  );
  return (
    <div style={{ position:'fixed', inset:0, zIndex:500, background:'rgba(10,26,46,0.72)', backdropFilter:'blur(4px)', display:'flex', alignItems:'flex-end' }} onClick={e => { if (e.target===e.currentTarget) setOpen(false); }}>
      <div style={{ width:'100%', maxWidth:700, margin:'0 auto', background:'#060d16', borderTop:'2px solid var(--accent)', borderLeft:'1px solid rgba(240,235,226,0.06)', borderRight:'1px solid rgba(240,235,226,0.06)', borderRadius:'4px 4px 0 0', display:'flex', flexDirection:'column', maxHeight:'54vh', boxShadow:'0 -24px 64px rgba(0,0,0,0.65)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 16px', borderBottom:'1px solid rgba(240,235,226,0.06)' }}>
          <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, color:'var(--accent)', letterSpacing:'0.14em', textTransform:'uppercase' }}>terminal · toby@portfolio</span>
          <button onClick={() => setOpen(false)} style={{ background:'none', border:'none', cursor:'none', fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:'var(--fg-muted)', padding:'0 4px' }}>esc ×</button>
        </div>
        <div ref={outRef} style={{ flex:1, overflowY:'auto', padding:'12px 16px', fontFamily:"'JetBrains Mono',monospace", fontSize:11, lineHeight:1.85 }}>
          {hist.map((l,i) => (
            <div key={i} style={{ color: l.s?'var(--accent)':l.p?'var(--fg-bright)':l.e?'#ff6b5b':'var(--fg-muted)', minHeight: l.t===''?6:'auto' }}>
              {l.p && <span style={{ color:'rgba(62,207,178,0.38)', marginRight:8 }}>~$</span>}
              {l.t}
            </div>
          ))}
        </div>
        <div style={{ padding:'6px 16px 10px', borderTop:'1px solid rgba(240,235,226,0.06)', display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:'rgba(62,207,178,0.38)' }}>~$</span>
          <input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')run(input);if(e.key==='Escape')setOpen(false);}} style={{ flex:1, background:'transparent', border:'none', outline:'none', fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:'var(--fg-bright)', caretColor:'var(--accent)', cursor:'text' }} placeholder="type a command…" spellCheck={false} autoComplete="off" />
        </div>
      </div>
    </div>
  );
}

// ── Hero ──────────────────────────────────────────────────────────────────────
function Hero() {
  const ROLES=['ENGINEER','ANALYST','BUILDER','TRIATHLETE','PRODUCER'];
  const RC=[{t:'#3ecfb2',b:'rgba(62,207,178,0.1)',br:'#3ecfb2'},{t:'#ff6b5b',b:'rgba(255,107,91,0.1)',br:'#ff6b5b'},{t:'#f0ebe2',b:'rgba(240,235,226,0.07)',br:'rgba(240,235,226,0.28)'},{t:'#6adcc4',b:'rgba(106,220,196,0.1)',br:'#6adcc4'},{t:'#ff8a7a',b:'rgba(255,138,122,0.1)',br:'#ff8a7a'}];
  const WB=[10,16,7,20,13,18,6,22,11,17,8,14,9,19];
  const FN='Toby Redshaw.';
  const [role,setRole]=useState(0);
  const [name,setName]=useState(FN);
  const [time,setTime]=useState('');
  const scRef=useRef(null);
  const CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
  useEffect(()=>{const t=setInterval(()=>setRole(a=>(a+1)%ROLES.length),1800);return()=>clearInterval(t);},[]);
  useEffect(()=>{const tick=()=>{const d=new Date();setTime(`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`);};tick();const t=setInterval(tick,10000);return()=>clearInterval(t);},[]);
  const scramble=()=>{let i=0;clearInterval(scRef.current);scRef.current=setInterval(()=>{setName(FN.split('').map((c,j)=>{if(c===' '||c==='.') return c;if(j<i) return FN[j];return CHARS[Math.floor(Math.random()*CHARS.length)];}).join(''));i+=1.3;if(i>FN.length){clearInterval(scRef.current);setName(FN);}},18);};

  return (
    <section id="hero" style={{ minHeight:'100vh', display:'flex', flexDirection:'column', justifyContent:'center' }}>
      <style>{`@keyframes wfbar{0%,100%{transform:scaleY(0.22)}50%{transform:scaleY(1)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-33.33%)}}`}</style>
      <div className="sect-label reveal">01 / HERO</div>

      <div className="reveal d1" style={{ display:'grid', gridTemplateColumns:'1.55fr 1fr 0.85fr', gridTemplateRows:'auto auto auto', gap:8 }}>
        {/* Name */}
        <div onMouseEnter={scramble} style={{ gridColumn:'1/2', gridRow:'1/4', background:'var(--bg-elevated)', border:'1px solid var(--border)', borderRadius:'var(--r-md)', padding:'32px 26px 26px', display:'flex', flexDirection:'column', justifyContent:'flex-end', position:'relative', overflow:'hidden', minHeight:300 }}>
          <div style={{ position:'absolute', inset:0, background:'radial-gradient(65% 52% at 15% 88%, rgba(62,207,178,0.05) 0%, transparent 65%)', pointerEvents:'none' }} />
          <h1 style={{ fontFamily:"'Fraunces',serif", fontWeight:300, fontSize:'clamp(42px,5vw,76px)', lineHeight:0.92, letterSpacing:'-0.025em', color:'var(--fg-bright)', position:'relative', marginBottom:16 }}>{name}</h1>
          <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:20 }}>
            {ROLES.map((r,i)=>{const c=RC[i];const on=i===role;return(<span key={r} style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, textTransform:'uppercase', letterSpacing:'0.11em', padding:'3px 8px', borderRadius:'var(--r-sm)', border:`1px solid ${on?c.br:'var(--border)'}`, color:on?c.t:'var(--fg-muted)', background:on?c.b:'transparent', transition:'all 0.26s var(--ease-out-soft)' }}>{r}</span>);})}
          </div>
          <div style={{ display:'flex', gap:10 }}>
            <a href="#projects" className="hoverable" style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, textTransform:'uppercase', letterSpacing:'0.11em', color:'var(--bg)', background:'var(--accent)', padding:'9px 18px', borderRadius:'var(--r-md)', textDecoration:'none', display:'inline-flex', alignItems:'center', gap:7, transition:'background var(--dur-base)' }} onMouseEnter={e=>e.currentTarget.style.background='var(--accent-hover)'} onMouseLeave={e=>e.currentTarget.style.background='var(--accent)'}>View work <span>→</span></a>
            <a href="#contact" className="hoverable" style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, textTransform:'uppercase', letterSpacing:'0.11em', color:'var(--fg)', border:'1px solid var(--border)', padding:'9px 18px', borderRadius:'var(--r-md)', textDecoration:'none', transition:'border-color var(--dur-base)' }} onMouseEnter={e=>e.currentTarget.style.borderColor='var(--border-strong)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>Say hello</a>
          </div>
          <div style={{ position:'absolute', top:12, right:12, fontFamily:"'JetBrains Mono',monospace", fontSize:7, color:'rgba(240,235,226,0.12)', letterSpacing:'0.1em' }}>HOVER NAME</div>
        </div>

        {/* Tagline */}
        <div style={{ gridColumn:'2/3', gridRow:'1/2', background:'var(--bg-elevated)', border:'1px solid var(--border)', borderRadius:'var(--r-md)', padding:'20px 18px', display:'flex', alignItems:'center' }}>
          <p style={{ fontFamily:"'Fraunces',serif", fontStyle:'italic', fontWeight:300, fontSize:'clamp(13px,1.35vw,17px)', color:'var(--fg)', lineHeight:1.45, opacity:0.72, margin:0 }}>I build things, mostly with code, sometimes on a bike.</p>

// ── Writing ───────────────────────────────────────────────────────────────────
function Writing() {
  const posts = [
    { date:'2026-04-12', title:'On forecasting under uncertainty', sub:'Models, margins of error, and what "good enough" means in practice.' },
    { date:'2026-03-08', title:'Three months of training data, one DNF', sub:'What the numbers said, what I ignored, and what I would do differently.' },
    { date:'2026-01-22', title:'What makes a good brief?', sub:'A brief is a design artefact. Most people treat it as a formality.' },
  ];
  const [hovDate, setHovDate] = useState({});
  const timers = useRef({});
  const startType = (i, date) => {
    let c = 0;
    clearInterval(timers.current[i]);
    setHovDate(h => ({ ...h, [i]: '' }));
    timers.current[i] = setInterval(() => {
      c++;
      setHovDate(h => ({ ...h, [i]: date.slice(0, c) }));
      if (c >= date.length) clearInterval(timers.current[i]);
    }, 38);
  };
  const stopType = (i) => { clearInterval(timers.current[i]); setHovDate(h => ({ ...h, [i]: undefined })); };
  return (
    <section id="writing" style={{ borderTop:'1px solid var(--border)' }}>
      <div className="sect-label reveal">05 / WRITING</div>
      <div className="reveal d1">
        {posts.map((p,i)=>(
          <a key={i} href="blog.html" className="post-row hoverable" onMouseEnter={()=>startType(i,p.date)} onMouseLeave={()=>stopType(i)} style={{ display:'flex', textDecoration:'none' }}>
            <span className="post-date">{hovDate[i] !== undefined ? hovDate[i] + (hovDate[i]?.length < p.date.length ? '▌' : '') : p.date}</span>
            <div style={{ flex:1 }}>

<script>
// ── Custom cursor ──────────────────────────────────────────────────────────
const cursor = document.getElementById('cursor');
let tx = -100, ty = -100, cx = -100, cy = -100;
(function tick() {
  cx += (tx - cx) * 0.4;
  cy += (ty - cy) * 0.4;
  cursor.style.left = cx + 'px';
  cursor.style.top  = cy + 'px';
  requestAnimationFrame(tick);
})();
document.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
document.addEventListener('mouseover', e => {
  cursor.classList.toggle('large', !!e.target.closest('a,button,.hoverable'));
});

// ── Scroll reveals ─────────────────────────────────────────────────────────
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('shown'); io.unobserve(e.target); } });
}, { threshold: 0.08 });
const attachReveals = () => document.querySelectorAll('.reveal:not(.shown)').forEach(el => io.observe(el));
attachReveals();
// Re-attach after React renders
setTimeout(attachReveals, 500);
</script>
