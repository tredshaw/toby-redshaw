    @keyframes grainShift { 0%{transform:translate(0,0)}16%{transform:translate(-4%,-2%)}33%{transform:translate(3%,4%)}50%{transform:translate(-3%,1%)}66%{transform:translate(2%,-3%)}83%{transform:translate(-1%,2%)} }

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function SidebarNav() {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 80);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <nav style={{ position:'fixed', left:0, top:0, bottom:0, width:76, display:'flex', flexDirection:'column', alignItems:'center', padding:'26px 0', borderRight:'1px solid rgba(240,235,226,0.06)', zIndex:100, gap:0 }}>
      <a href="/" className="hoverable" style={{ background:'none', border:'none', cursor:'none', marginBottom:32, padding:0, textDecoration:'none' }}>
        {scrolled ? (
          <span className="tr-mark" style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:15, fontWeight:500, letterSpacing:'0.2em', color:'var(--fg-bright)' }}>T<span style={{ color:'var(--accent)' }}>·</span>R</span>
        ) : (
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, fontWeight:500, letterSpacing:'0.18em', color:'var(--fg-bright)', lineHeight:1.5, display:'flex', flexDirection:'column', alignItems:'center', textTransform:'uppercase' }}>
            <span>TOBY</span>
            <span style={{ color:'var(--accent)', lineHeight:0.5, fontSize:9 }}>·</span>
            <span>REDSHAW</span>
          </div>
        )}
      </a>
      <div style={{ flex:1, display:'flex', flexDirection:'column', justifyContent:'center', gap:18 }}>
        <a href="/blog" className="hoverable" title="All writing" style={{ textDecoration:'none', display:'flex', flexDirection:'column', alignItems:'center', gap:3 }}>
          <div style={{ width:7, height:7, borderRadius:'50%', border:'1px solid var(--border-strong)' }} />
          <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:8, letterSpacing:'0.12em', color:'var(--fg-faint)' }}>IDX</span>
        </a>
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:3 }}>
          <div style={{ width:10, height:10, borderRadius:'50%', background:'var(--accent)', boxShadow:'0 0 0 4px rgba(62,207,178,0.14)' }} />
          <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:8, letterSpacing:'0.12em', color:'var(--accent)' }}>RD</span>
        </div>
      </div>
      <a href="/blog" className="hoverable" style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, color:'var(--fg-muted)', letterSpacing:'0.14em', textTransform:'uppercase', textDecoration:'none', writingMode:'vertical-rl', transform:'rotate(180deg)' }}>← all writing</a>
    </nav>
  );
}

const TCMDS = {
  help:['Available commands:','  about · projects · blog · contact · clear · exit'],
  about:['Trained as an economist. Mostly writes Python now.'],
  projects:['Lab2Launch ——— IN PROGRESS · 2026','Eddy ——————— SHIPPED · 2024'],
  blog:['On forecasting under uncertainty     · 2026-04-12','Three months of training, one DNF   · 2026-03-08'],
  contact:["toby@redshaw.me"],
};
function ThemeToggle() {
  const [theme, setTheme] = useState('dark');
  useEffect(() => {
    const saved = localStorage.getItem('theme') || 'dark';
    document.body.dataset.theme = saved;
    setTheme(saved);
  }, []);
  const toggle = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;
    const next = theme === 'dark' ? 'light' : 'dark';
    const nextBg = next === 'light' ? '#f5f1e8' : '#0d1f35';
    const maxR = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
    const overlay = document.createElement('div');
    overlay.style.cssText = `position:fixed;inset:0;z-index:9998;background:${nextBg};pointer-events:none;clip-path:circle(0px at ${x}px ${y}px);transition:clip-path 560ms cubic-bezier(0.65,0,0.35,1);will-change:clip-path,opacity;`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { overlay.style.clipPath = `circle(${maxR}px at ${x}px ${y}px)`; });
    });
    const onExpand = (e) => {
      if (e.propertyName !== 'clip-path') return;
      overlay.removeEventListener('transitionend', onExpand);
      document.body.dataset.theme = next;
      setTheme(next);
      localStorage.setItem('theme', next);
      requestAnimationFrame(() => {
        overlay.style.transition = 'opacity 360ms ease-out';
        overlay.style.opacity = '0';
      });
      overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
    };
    overlay.addEventListener('transitionend', onExpand);
  };
  const isDark = theme === 'dark';
  return (
    <button onClick={toggle} aria-label="Toggle theme" className="hoverable" style={{ position:'fixed', top:18, right:74, zIndex:300, width:44, height:44, background:'var(--chrome-bg)', backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)', border:'1px solid var(--border-strong)', borderRadius:'var(--r-md)', cursor:'none', display:'flex', alignItems:'center', justifyContent:'center', padding:0, transition:'border-color var(--dur-base), background var(--dur-base)' }} onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border-strong)'}>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="var(--fg-bright)" strokeWidth="1.4" strokeLinecap="round">
        {isDark ? (
          <g>
            <circle cx="10" cy="10" r="3.4" fill="var(--accent)" stroke="var(--accent)" />
            {[0,1,2,3,4,5,6,7].map(i => { const a = (i*Math.PI)/4; const x1 = 10 + Math.cos(a)*5.6; const y1 = 10 + Math.sin(a)*5.6; const x2 = 10 + Math.cos(a)*7.6; const y2 = 10 + Math.sin(a)*7.6; return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="var(--fg-bright)" />; })}
          </g>
        ) : (
          <path d="M 15 12.5 A 6.5 6.5 0 1 1 8 5 A 5 5 0 0 0 15 12.5 Z" fill="var(--accent)" stroke="var(--accent)" />
        )}
      </svg>
    </button>
  );
}

function FloatingMenu({ current }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const onClick = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = e => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onClick);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onClick); document.removeEventListener('keydown', onKey); };
  }, []);
  const items = [
    { key:'home',     label:'Home',     href:'/' },
    { key:'articles', label:'Articles', href:'/blog'  },
  ];
  return (
    <div ref={ref} style={{ position:'fixed', top:18, right:18, zIndex:300 }}>
      <button onClick={() => setOpen(o => !o)} aria-label="Menu" className="hoverable" style={{ width:44, height:44, background:'var(--chrome-bg)', backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)', border:`1px solid ${open?'var(--accent)':'var(--border-strong)'}`, borderRadius:'var(--r-md)', cursor:'none', display:'flex', alignItems:'center', justifyContent:'center', padding:0, transition:'border-color var(--dur-base), background var(--dur-base)' }}>
        <svg width="22" height="14" viewBox="0 0 22 14" style={{ overflow:'visible' }}>
          {open ? (
            <g>
              <line x1="4" y1="3" x2="18" y2="11" stroke="var(--accent)" strokeWidth="1.6" strokeLinecap="round" />
              <line x1="4" y1="11" x2="18" y2="3" stroke="var(--accent)" strokeWidth="1.6" strokeLinecap="round" />
            </g>
          ) : (
            <g>
              <path className="wave-line" d="M 2 3 Q 6.5 0.4 11 3 T 20 3" stroke="var(--fg-bright)" strokeWidth="1.4" fill="none" strokeLinecap="round" />
              <path className="wave-line" d="M 2 7 Q 6.5 4.4 11 7 T 20 7" stroke="var(--accent)" strokeWidth="1.4" fill="none" strokeLinecap="round" />
              <path className="wave-line" d="M 2 11 Q 6.5 8.4 11 11 T 20 11" stroke="var(--fg-bright)" strokeWidth="1.4" fill="none" strokeLinecap="round" />
            </g>
          )}
        </svg>
      </button>
      {open && (
        <div style={{ position:'absolute', top:52, right:0, minWidth:180, background:'var(--chrome-bg-strong)', backdropFilter:'blur(12px)', WebkitBackdropFilter:'blur(12px)', border:'1px solid var(--border-strong)', borderRadius:'var(--r-md)', padding:6, boxShadow:'var(--shadow-2)', animation:'menuDrop 0.22s var(--ease-out-quart)' }}>
          {items.map(item => {
            const active = current === item.key;
            return (
              <a key={item.key} href={item.href} className="hoverable" style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 14px', fontFamily:"'JetBrains Mono',monospace", fontSize:10.5, textTransform:'uppercase', letterSpacing:'0.14em', color: active?'var(--accent)':'var(--fg)', textDecoration:'none', borderRadius:'var(--r-sm)', transition:'background var(--dur-base), color var(--dur-base)' }} onMouseEnter={e=>{ if(!active) e.currentTarget.style.background='rgba(62,207,178,0.08)'; }} onMouseLeave={e=>{ e.currentTarget.style.background='transparent'; }}>
                <span>{item.label}</span>
                <span style={{ color:active?'var(--accent)':'var(--fg-faint)', fontSize:9 }}>{active ? '●' : '→'}</span>
              </a>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Terminal() {
  const [open, setOpen] = useState(false);
  const [input, setInput] = useState('');
  const [hist, setHist] = useState([]);
  const inputRef = useRef(null);
  const outRef = useRef(null);
  useEffect(() => {
    const onKey = e => {
      if (e.key === '/' && !open && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) { e.preventDefault(); setOpen(true); }
      if (e.key === 'Escape') setOpen(false);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open]);
  useEffect(() => { if (open) { setTimeout(() => inputRef.current?.focus(), 80); if (!hist.length) setHist([{ s:true, t:"toby@portfolio — type 'help' to explore" }]); } }, [open]);
  useEffect(() => { if (outRef.current) outRef.current.scrollTop = outRef.current.scrollHeight; }, [hist]);
  const run = cmd => {
    const k = cmd.trim().toLowerCase();
    if (!k) return;
    if (k === 'clear') { setHist([]); setInput(''); return; }
    if (k === 'exit') { setOpen(false); setInput(''); return; }
    const res = TCMDS[k] ? TCMDS[k].map(t => ({ t })) : [{ e:true, t:`command not found: ${cmd}  (try 'help')` }];
    setHist(h => [...h, { p:true, t:cmd }, ...res, { t:'' }]);
    setInput('');
  };
  if (!open) return (
    <div style={{ position:'fixed', bottom:18, left:'50%', transform:'translateX(-50%)', zIndex:200, pointerEvents:'none' }}>
      <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, color:'rgba(240,235,226,0.14)', letterSpacing:'0.14em', textTransform:'uppercase' }}>press / to open terminal</span>
    </div>
  );
  return (
    <div style={{ position:'fixed', inset:0, zIndex:500, background:'rgba(10,26,46,0.72)', backdropFilter:'blur(4px)', display:'flex', alignItems:'flex-end' }} onClick={e => { if (e.target===e.currentTarget) setOpen(false); }}>
      <div style={{ width:'100%', maxWidth:700, margin:'0 auto', background:'#060d16', borderTop:'2px solid var(--accent)', borderLeft:'1px solid rgba(240,235,226,0.06)', borderRight:'1px solid rgba(240,235,226,0.06)', borderRadius:'4px 4px 0 0', display:'flex', flexDirection:'column', maxHeight:'54vh', boxShadow:'0 -24px 64px rgba(0,0,0,0.65)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 16px', borderBottom:'1px solid rgba(240,235,226,0.06)' }}>
          <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, color:'var(--accent)', letterSpacing:'0.14em', textTransform:'uppercase' }}>terminal · toby@portfolio</span>
          <button onClick={() => setOpen(false)} style={{ background:'none', border:'none', cursor:'none', fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:'var(--fg-muted)', padding:'0 4px' }}>esc ×</button>
        </div>
        <div ref={outRef} style={{ flex:1, overflowY:'auto', padding:'12px 16px', fontFamily:"'JetBrains Mono',monospace", fontSize:11, lineHeight:1.85 }}>
          {hist.map((l,i) => (
            <div key={i} style={{ color: l.s?'var(--accent)':l.p?'var(--fg-bright)':l.e?'#ff6b5b':'var(--fg-muted)', minHeight: l.t===''?6:'auto' }}>
              {l.p && <span style={{ color:'rgba(62,207,178,0.38)', marginRight:8 }}>~$</span>}
              {l.t}
            </div>
          ))}
        </div>
        <div style={{ padding:'6px 16px 10px', borderTop:'1px solid rgba(240,235,226,0.06)', display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:'rgba(62,207,178,0.38)' }}>~$</span>
          <input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')run(input);if(e.key==='Escape')setOpen(false);}} style={{ flex:1, background:'transparent', border:'none', outline:'none', fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:'var(--fg-bright)', caretColor:'var(--accent)', cursor:'text' }} placeholder="type a command…" spellCheck={false} autoComplete="off" />
        </div>
      </div>
    </div>
  );
}

function Article({ post }) {
  const html = post && post.body ? marked.parse(post.body) : '';
  const primaryTag = post && post.tags && post.tags[0];
  return (
    <article className="article-wrap">
      <div className="reveal" style={{ marginBottom:32, display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
        <a href="/blog" className="hoverable" style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, textTransform:'uppercase', letterSpacing:'0.12em', color:'var(--fg)', border:'1px solid var(--border)', padding:'8px 14px', borderRadius:'var(--r-md)', textDecoration:'none', display:'inline-flex', alignItems:'center', gap:7, transition:'border-color var(--dur-base), color var(--dur-base)' }} onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--accent)';e.currentTarget.style.color='var(--accent)';}} onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.color='var(--fg)';}}><span>←</span> All writing</a>
        <a href="/" className="hoverable" style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, textTransform:'uppercase', letterSpacing:'0.12em', color:'var(--fg)', border:'1px solid var(--border)', padding:'8px 14px', borderRadius:'var(--r-md)', textDecoration:'none', display:'inline-flex', alignItems:'center', gap:7, transition:'border-color var(--dur-base), color var(--dur-base)' }} onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--accent)';e.currentTarget.style.color='var(--accent)';}} onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.color='var(--fg)';}}>Portfolio home</a>
      </div>
      {!post ? (
        <div style={{ fontFamily:"'Fraunces',serif", fontWeight:300, fontSize:'var(--fs-2xl)', color:'var(--fg-muted)', marginTop:80 }}>Post not found. <a href="/blog" style={{ color:'var(--accent)' }}>Back to writing →</a></div>
      ) : (
        <>
          <header className="reveal d1" style={{ marginBottom:48 }}>
            <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, textTransform:'uppercase', letterSpacing:'0.14em', color:'var(--accent)', marginBottom:18, display:'flex', gap:18, alignItems:'center', flexWrap:'wrap' }}>
              <span>{post.date}</span><span style={{ color:'var(--fg-faint)' }}>·</span><span>{post.read} read</span>{primaryTag && (<><span style={{ color:'var(--fg-faint)' }}>·</span><span>{primaryTag}</span></>)}
            </div>
            <h1 style={{ fontFamily:"'Fraunces',serif", fontWeight:300, fontSize:'clamp(42px,5.4vw,76px)', lineHeight:0.98, letterSpacing:'-0.025em', color:'var(--fg-bright)', marginBottom:24 }}>{post.title}</h1>
            <p style={{ fontFamily:"'Fraunces',serif", fontStyle:'italic', fontWeight:300, fontSize:'var(--fs-xl)', lineHeight:1.4, color:'var(--fg-muted)' }}>{post.sub}</p>
          </header>
          <div className="prose reveal d2" dangerouslySetInnerHTML={{ __html: html }} />
        </>
      )}
    </article>
  );
}

function Footer({ prev, next }) {
  return (
    <footer style={{ borderTop:'1px solid var(--border)', padding:'48px 52px 96px', maxWidth:1100 }}>
      <div className="sect-label reveal">CONTINUE</div>
      <div className="reveal d1" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
        {prev ? (
          <a href={`/article?slug=${prev.slug}`} className="hoverable" style={{ background:'var(--bg-elevated)', border:'1px solid var(--border)', borderRadius:'var(--r-md)', padding:'20px 22px', textDecoration:'none', transition:'border-color var(--dur-base)' }} onMouseEnter={e=>e.currentTarget.style.borderColor='var(--border-strong)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
            <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, textTransform:'uppercase', letterSpacing:'0.12em', color:'var(--fg-muted)', marginBottom:10 }}>← Previous · {prev.date}</div>
            <div style={{ fontFamily:"'Fraunces',serif", fontWeight:300, fontSize:'var(--fs-lg)', color:'var(--fg-bright)', lineHeight:1.25 }}>{prev.title}</div>
          </a>
        ) : <div />}
        {next ? (
          <a href={`/article?slug=${next.slug}`} className="hoverable" style={{ background:'var(--bg-elevated)', border:'1px solid var(--border)', borderRadius:'var(--r-md)', padding:'20px 22px', textDecoration:'none', textAlign:'right' }} onMouseEnter={e=>e.currentTarget.style.borderColor='var(--border-strong)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
            <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, textTransform:'uppercase', letterSpacing:'0.12em', color:'var(--fg-muted)', marginBottom:10 }}>Next · {next.date} →</div>
            <div style={{ fontFamily:"'Fraunces',serif", fontWeight:300, fontSize:'var(--fs-lg)', color:'var(--fg-bright)', lineHeight:1.25 }}>{next.title}</div>
          </a>
        ) : (
          <a href="/blog" className="hoverable" style={{ background:'transparent', border:'1px dashed var(--border)', borderRadius:'var(--r-md)', padding:'20px 22px', textDecoration:'none', textAlign:'right', display:'flex', flexDirection:'column', justifyContent:'center' }}>
            <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, textTransform:'uppercase', letterSpacing:'0.12em', color:'var(--fg-muted)', marginBottom:6 }}>End of feed →</div>
            <div style={{ fontFamily:"'Fraunces',serif", fontStyle:'italic', fontWeight:300, fontSize:'var(--fs-md)', color:'var(--fg-muted)' }}>See all writing</div>
          </a>
        )}
      </div>
    </footer>
  );
}

function App() {
  const [state, setState] = useState(null);
  useEffect(() => {
    fetch('content/posts.json').then(r => r.json()).then(({ posts }) => {
      // Sort by date desc for consistent prev/next
      const sorted = posts.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug') || (sorted[0] && sorted[0].slug);
      const idx = sorted.findIndex(p => p.slug === slug);
      const post = idx >= 0 ? sorted[idx] : null;
      const prev = idx >= 0 && idx < sorted.length - 1 ? sorted[idx + 1] : null;
      const next = idx > 0 ? sorted[idx - 1] : null;
      if (post) document.title = `${post.title} — Toby Redshaw`;
      setState({ post, prev, next });
    }).catch(err => console.error('Content load failed:', err));
  }, []);
  if (!state) return <div style={{ position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:'var(--fg-muted)', letterSpacing:'0.14em', textTransform:'uppercase' }}>loading…</div>;
  return (
    <>
      <Terminal />
      <SidebarNav />
      <ThemeToggle />
      <FloatingMenu current="articles" />
      <div className="page">
        <Article post={state.post} />
        <Footer prev={state.prev} next={state.next} />
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
const cursor = document.getElementById('cursor');
let tx = -100, ty = -100, cx = -100, cy = -100;
(function tick() {
  cx += (tx - cx) * 0.4;
  cy += (ty - cy) * 0.4;
  cursor.style.left = cx + 'px';
  cursor.style.top  = cy + 'px';
  requestAnimationFrame(tick);
})();
document.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
document.addEventListener('mouseover', e => {
  cursor.classList.toggle('large', !!e.target.closest('a,button,.hoverable'));
});

const progress = document.getElementById('progress');
const updateProgress = () => {
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  const p = max > 0 ? (h.scrollTop / max) * 100 : 0;
  progress.style.width = p + '%';
};
window.addEventListener('scroll', updateProgress, { passive: true });
updateProgress();

const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('shown'); io.unobserve(e.target); } });
}, { threshold: 0.08 });
const attachReveals = () => document.querySelectorAll('.reveal:not(.shown)').forEach(el => io.observe(el));
attachReveals();
setTimeout(attachReveals, 500);
</script>
</body>
</html>
