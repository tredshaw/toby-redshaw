<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy-900:#0a1a2e;--navy-800:#0d1f35;--navy-700:#112844;--navy-600:#16324f;--navy-500:#1d3c5e;
      --seafoam-400:#3ecfb2;--seafoam-500:#2fb89c;--seafoam-300:#6adcc4;--seafoam-glow:rgba(62,207,178,0.18);

      --accent:var(--seafoam-400);--accent-hover:var(--seafoam-300);--accent-press:var(--seafoam-500);--accent-soft:var(--seafoam-glow);
      --secondary-accent:var(--coral-400);

      --fs-xs:12px;--fs-sm:14px;--fs-base:16px;--fs-md:18px;--fs-lg:22px;--fs-xl:28px;--fs-2xl:38px;--fs-3xl:52px;--fs-4xl:72px;--fs-5xl:96px;--fs-6xl:128px;
      --lh-tight:1.05;--lh-snug:1.25;--lh-body:1.9;--lh-prose:1.7;
      --tracking-mono:0.12em;--tracking-display:-0.02em;--tracking-tight:-0.01em;
      --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-6:24px;--s-8:32px;--s-10:40px;--s-12:48px;--s-16:64px;--s-20:80px;--s-24:96px;--s-32:128px;
      --r-sm:2px;--r-md:4px;--r-lg:12px;--r-pill:999px;
      --shadow-1:0 2px 4px rgba(0,0,0,0.45);--shadow-2:0 8px 24px rgba(0,0,0,0.55);--shadow-3:0 20px 56px rgba(0,0,0,0.7);--shadow-accent:0 0 24px var(--accent-soft);--inset-hairline:inset 0 1px 0 rgba(240,235,226,0.04);
      --chrome-bg:rgba(13,31,53,0.78);--chrome-bg-strong:rgba(13,31,53,0.94);
      --ease-out-soft:cubic-bezier(0.22,0.61,0.36,1);--ease-out-quart:cubic-bezier(0.165,0.84,0.44,1);--ease-in-out:cubic-bezier(0.65,0,0.35,1);--ease-funky:cubic-bezier(0.34,1.56,0.64,1);
      --dur-quick:120ms;--dur-base:240ms;--dur-slow:480ms;--dur-reveal:720ms;--dur-tide:12s;
    }
    body[data-theme="light"] {
      --bg: #f5f1e8; --bg-elevated: #ece5d4; --bg-hover: #ddd6c4;
      --fg: #1d3c5e; --fg-bright: #0a1a2e; --fg-muted: #4b5563; --fg-faint: #9ca3af;
      --border: rgba(10,26,46,0.1); --border-strong: rgba(10,26,46,0.22);
      --accent-soft: rgba(47,184,156,0.18);
      --chrome-bg: rgba(245,241,232,0.82); --chrome-bg-strong: rgba(245,241,232,0.96);
    }
    body[data-theme="light"] .tide { background: radial-gradient(60% 50% at 18% 28%, rgba(62,207,178,0.1), transparent 60%), radial-gradient(70% 65% at 82% 72%, rgba(217,211,198,0.6), transparent 60%), var(--bg); }
    body[data-theme="light"] .grain { opacity: 0.03; mix-blend-mode: multiply; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-weight: 300; line-height: var(--lh-body); cursor: none; overflow-x: hidden; -webkit-font-smoothing: antialiased; transition: background var(--dur-base), color var(--dur-base); }
    .tide { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(60% 50% at 18% 28%, rgba(62,207,178,0.055), transparent 60%), radial-gradient(70% 65% at 82% 72%, rgba(22,50,79,0.55), transparent 60%), var(--bg); animation: tide var(--dur-tide) ease-in-out infinite alternate; }
    @keyframes tide { 0% { opacity: 1; } 100% { opacity: 0.85; } }
    .grain { position: fixed; inset: -50%; z-index: 1; pointer-events: none; background: url('assets/grain.svg') repeat; background-size: 200px 200px; opacity: 0.055; mix-blend-mode: overlay; animation: grainShift 0.8s steps(6) infinite; }
    @keyframes grainShift { 0%{transform:translate(0,0)}16%{transform:translate(-4%,-2%)}33%{transform:translate(3%,4%)}50%{transform:translate(-3%,1%)}66%{transform:translate(2%,-3%)}83%{transform:translate(-1%,2%)} }
    .cursor-dot { position: fixed; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); transition: width 110ms ease, height 110ms ease, background 110ms ease, border 110ms ease; border: 0px solid transparent; }
    .cursor-dot.large { width: 22px; height: 22px; background: transparent; border: 2px solid var(--accent); }
    .page { position: relative; z-index: 2; margin-left: 76px; }
    section { padding: 96px 52px 80px; }
    .sect-label { font-family: var(--font-mono); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: var(--tracking-mono); color: var(--accent); margin-bottom: 24px; display: flex; align-items: center; gap: 18px; }
    .sect-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .reveal { opacity: 0; transform: translateY(16px); transition: opacity var(--dur-reveal) var(--ease-out-quart), transform var(--dur-reveal) var(--ease-out-quart); }
    .reveal.shown { opacity: 1; transform: none; }
    .d1 { transition-delay: 80ms; } .d2 { transition-delay: 160ms; } .d3 { transition-delay: 240ms; }
    .post-row { display: flex; align-items: baseline; gap: 20px; padding: 20px 0; border-top: 1px solid var(--border); cursor: default; position: relative; transition: padding var(--dur-base); }
    .post-row::before { content: ''; position: absolute; top: -1px; left: 0; width: 0; height: 2px; background: var(--accent); transition: width 0.32s var(--ease-out-quart); }
    .post-row:hover::before { width: 100%; }
    .post-row:hover .post-date { color: var(--accent); }
    .post-row:hover .post-title { color: var(--fg-bright); }
    .post-date { font-family: var(--font-mono); font-size: 10px; color: var(--fg-faint); width: 110px; flex-shrink: 0; transition: color var(--dur-base); letter-spacing: 0.06em; }
    .post-title { font-family: var(--font-display); font-weight: 300; font-size: var(--fs-2xl); color: var(--fg); line-height: var(--lh-snug); transition: color var(--dur-base); letter-spacing:-0.01em; }
    .tr-mark { display: inline-block; transform-origin: 50% 50%; }
    .tr-mark:hover { animation: spin-tr 1.4s linear infinite; }
    @keyframes spin-tr { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    .wave-line { transform-origin: 50% 50%; animation: wave 2.6s ease-in-out infinite; }
    .wave-line:nth-child(2) { animation-delay: -0.85s; }
    .wave-line:nth-child(3) { animation-delay: -1.7s; }
    @keyframes wave { 0%,100% { transform: translateX(-1.2px); } 50% { transform: translateX(1.2px); } }
    @keyframes menuDrop { from { opacity: 0; transform: translateY(-6px) scale(0.96); } to { opacity: 1; transform: none; } }
    * { scrollbar-width: thin; scrollbar-color: var(--accent) var(--bg); }
    *::-webkit-scrollbar { width: 6px; } *::-webkit-scrollbar-track { background: var(--bg); } *::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 999px; }
  </style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const SECTIONS = [
  { id:'hero',       label:'Home',       num:'01' },
  { id:'featured',   label:'Featured',   num:'02' },
  { id:'index',      label:'Index',      num:'03' },
];

function SidebarNav() {
  const [scrolled, setScrolled] = useState(false);
  const [active, setActive] = useState('hero');
  useEffect(() => {
    const onScroll = () => {
      setScrolled(window.scrollY > 80);
      let cur = 'hero';
      for (const s of SECTIONS) {
        const el = document.getElementById(s.id);
        if (el && el.getBoundingClientRect().top < window.innerHeight * 0.45) cur = s.id;
      }
      setActive(cur);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const go = (id) => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.offsetTop - 28, behavior: 'smooth' }); };
  return (
    <nav style={{ position:'fixed', left:0, top:0, bottom:0, width:76, display:'flex', flexDirection:'column', alignItems:'center', padding:'26px 0', borderRight:'1px solid rgba(240,235,226,0.06)', zIndex:100, gap:0 }}>
      <a href="/" className="hoverable" style={{ background:'none', border:'none', cursor:'none', marginBottom:32, padding:0, textDecoration:'none' }}>
        {scrolled ? (
          <span className="tr-mark" style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:15, fontWeight:500, letterSpacing:'0.2em', color:'var(--fg-bright)' }}>T<span style={{ color:'var(--accent)' }}>·</span>R</span>
        ) : (
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, fontWeight:500, letterSpacing:'0.18em', color:'var(--fg-bright)', lineHeight:1.5, display:'flex', flexDirection:'column', alignItems:'center', textTransform:'uppercase' }}>
            <span>TOBY</span>
            <span style={{ color:'var(--accent)', lineHeight:0.5, fontSize:9 }}>·</span>
            <span>REDSHAW</span>
          </div>
        )}
      </a>
      <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:12, flex:1, justifyContent:'center' }}>
        {SECTIONS.map(s => {
          const on = active === s.id;
          return (
            <button key={s.id} onClick={() => go(s.id)} title={s.label} style={{ background:'none', border:'none', cursor:'none', padding:'3px 0', display:'flex', flexDirection:'column', alignItems:'center', gap:3 }}>
              <div style={{ width: on?10:7, height: on?10:7, borderRadius:'50%', background: on?'var(--accent)':'transparent', border:`1px solid ${on?'var(--accent)':'var(--border-strong)'}`, boxShadow: on?'0 0 0 4px rgba(62,207,178,0.14)':'none', transition:'all 0.22s cubic-bezier(0.34,1.56,0.64,1)' }} />
              <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:8, letterSpacing:'0.12em', color: on?'var(--accent)':'var(--fg-faint)', transition:'color 0.2s' }}>{s.num}</span>
            </button>
          );
        })}
      </div>
      <a href="/" className="hoverable" style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, color:'var(--fg-muted)', letterSpacing:'0.14em', textTransform:'uppercase', textDecoration:'none', writingMode:'vertical-rl', transform:'rotate(180deg)' }}>← home</a>
    </nav>
  );
}

const TCMDS = {
  help:['Available commands:','  about · projects · experience · now · contact · blog · clear · exit'],
  about:['Trained as an economist. Mostly writes Python now.','MSc Economics, Imperial College London.'],
  projects:['Lab2Launch ——— IN PROGRESS · 2026','Eddy ——————— SHIPPED · 2024','MIA Dissertation — RESEARCH · 2023'],
  experience:['Senior BA  ——  Accenture  · 2023–now','Analyst    ——  Co-op      · 2021–23','Economist  ——  HMRC       · 2019–21'],
  now:['Location  · London','Training  · 70.3 triathlon, Sep 2026'],
  contact:["Email's the fastest.",'','toby@redshaw.me'],
  blog:['On forecasting under uncertainty     · 2026-04-12','Three months of training, one DNF   · 2026-03-08','What makes a good brief?            · 2026-01-22'],
};
function ThemeToggle() {
  const [theme, setTheme] = useState('dark');
  useEffect(() => {
    const saved = localStorage.getItem('theme') || 'dark';
    document.body.dataset.theme = saved;
    setTheme(saved);
  }, []);
  const toggle = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;
    const next = theme === 'dark' ? 'light' : 'dark';
    const nextBg = next === 'light' ? '#f5f1e8' : '#0d1f35';
    const maxR = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
    const overlay = document.createElement('div');
    overlay.style.cssText = `position:fixed;inset:0;z-index:9998;background:${nextBg};pointer-events:none;clip-path:circle(0px at ${x}px ${y}px);transition:clip-path 560ms cubic-bezier(0.65,0,0.35,1);will-change:clip-path,opacity;`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { overlay.style.clipPath = `circle(${maxR}px at ${x}px ${y}px)`; });
    });
    const onExpand = (e) => {
      if (e.propertyName !== 'clip-path') return;
      overlay.removeEventListener('transitionend', onExpand);
      document.body.dataset.theme = next;
      setTheme(next);
      localStorage.setItem('theme', next);
      requestAnimationFrame(() => {
        overlay.style.transition = 'opacity 360ms ease-out';
        overlay.style.opacity = '0';
      });
      overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
    };
    overlay.addEventListener('transitionend', onExpand);
  };
  const isDark = theme === 'dark';
  return (
    <button onClick={toggle} aria-label="Toggle theme" className="hoverable" style={{ position:'fixed', top:18, right:74, zIndex:300, width:44, height:44, background:'var(--chrome-bg)', backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)', border:'1px solid var(--border-strong)', borderRadius:'var(--r-md)', cursor:'none', display:'flex', alignItems:'center', justifyContent:'center', padding:0, transition:'border-color var(--dur-base), background var(--dur-base)' }} onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border-strong)'}>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="var(--fg-bright)" strokeWidth="1.4" strokeLinecap="round">
        {isDark ? (
          <g>
            <circle cx="10" cy="10" r="3.4" fill="var(--accent)" stroke="var(--accent)" />
            {[0,1,2,3,4,5,6,7].map(i => { const a = (i*Math.PI)/4; const x1 = 10 + Math.cos(a)*5.6; const y1 = 10 + Math.sin(a)*5.6; const x2 = 10 + Math.cos(a)*7.6; const y2 = 10 + Math.sin(a)*7.6; return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="var(--fg-bright)" />; })}
          </g>
        ) : (
          <path d="M 15 12.5 A 6.5 6.5 0 1 1 8 5 A 5 5 0 0 0 15 12.5 Z" fill="var(--accent)" stroke="var(--accent)" />
        )}
      </svg>
    </button>
  );
}

function FloatingMenu({ current }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const onClick = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = e => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onClick);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onClick); document.removeEventListener('keydown', onKey); };
  }, []);
  const items = [
    { key:'home',     label:'Home',     href:'/' },
    { key:'articles', label:'Articles', href:'/blog'  },
  ];
  return (
    <div ref={ref} style={{ position:'fixed', top:18, right:18, zIndex:300 }}>
      <button onClick={() => setOpen(o => !o)} aria-label="Menu" className="hoverable" style={{ width:44, height:44, background:'var(--chrome-bg)', backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)', border:`1px solid ${open?'var(--accent)':'var(--border-strong)'}`, borderRadius:'var(--r-md)', cursor:'none', display:'flex', alignItems:'center', justifyContent:'center', padding:0, transition:'border-color var(--dur-base), background var(--dur-base)' }}>
        <svg width="22" height="14" viewBox="0 0 22 14" style={{ overflow:'visible' }}>
          {open ? (
            <g>
              <line x1="4" y1="3" x2="18" y2="11" stroke="var(--accent)" strokeWidth="1.6" strokeLinecap="round" />
              <line x1="4" y1="11" x2="18" y2="3" stroke="var(--accent)" strokeWidth="1.6" strokeLinecap="round" />
            </g>
          ) : (
            <g>
              <path className="wave-line" d="M 2 3 Q 6.5 0.4 11 3 T 20 3" stroke="var(--fg-bright)" strokeWidth="1.4" fill="none" strokeLinecap="round" />
              <path className="wave-line" d="M 2 7 Q 6.5 4.4 11 7 T 20 7" stroke="var(--accent)" strokeWidth="1.4" fill="none" strokeLinecap="round" />
              <path className="wave-line" d="M 2 11 Q 6.5 8.4 11 11 T 20 11" stroke="var(--fg-bright)" strokeWidth="1.4" fill="none" strokeLinecap="round" />
            </g>
          )}
        </svg>
      </button>
      {open && (
        <div style={{ position:'absolute', top:52, right:0, minWidth:180, background:'var(--chrome-bg-strong)', backdropFilter:'blur(12px)', WebkitBackdropFilter:'blur(12px)', border:'1px solid var(--border-strong)', borderRadius:'var(--r-md)', padding:6, boxShadow:'var(--shadow-2)', animation:'menuDrop 0.22s var(--ease-out-quart)' }}>
          {items.map(item => {
            const active = current === item.key;
            return (
              <a key={item.key} href={item.href} className="hoverable" style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 14px', fontFamily:"'JetBrains Mono',monospace", fontSize:10.5, textTransform:'uppercase', letterSpacing:'0.14em', color: active?'var(--accent)':'var(--fg)', textDecoration:'none', borderRadius:'var(--r-sm)', transition:'background var(--dur-base), color var(--dur-base)' }} onMouseEnter={e=>{ if(!active) e.currentTarget.style.background='rgba(62,207,178,0.08)'; }} onMouseLeave={e=>{ e.currentTarget.style.background='transparent'; }}>
                <span>{item.label}</span>
                <span style={{ color:active?'var(--accent)':'var(--fg-faint)', fontSize:9 }}>{active ? '●' : '→'}</span>
              </a>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Terminal() {
  const [open, setOpen] = useState(false);
  const [input, setInput] = useState('');
  const [hist, setHist] = useState([]);
  const inputRef = useRef(null);
  const outRef = useRef(null);
  useEffect(() => {
    const onKey = e => {
      if (e.key === '/' && !open && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) { e.preventDefault(); setOpen(true); }
      if (e.key === 'Escape') setOpen(false);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open]);
  useEffect(() => { if (open) { setTimeout(() => inputRef.current?.focus(), 80); if (!hist.length) setHist([{ s:true, t:"toby@portfolio — type 'help' to explore" }]); } }, [open]);
  useEffect(() => { if (outRef.current) outRef.current.scrollTop = outRef.current.scrollHeight; }, [hist]);
  const run = cmd => {
    const k = cmd.trim().toLowerCase();
    if (!k) return;
    if (k === 'clear') { setHist([]); setInput(''); return; }
    if (k === 'exit') { setOpen(false); setInput(''); return; }
    const res = TCMDS[k] ? TCMDS[k].map(t => ({ t })) : [{ e:true, t:`command not found: ${cmd}  (try 'help')` }];
    setHist(h => [...h, { p:true, t:cmd }, ...res, { t:'' }]);
    setInput('');
  };
  if (!open) return (
    <div style={{ position:'fixed', bottom:18, left:'50%', transform:'translateX(-50%)', zIndex:200, pointerEvents:'none' }}>
      <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, color:'rgba(240,235,226,0.14)', letterSpacing:'0.14em', textTransform:'uppercase' }}>press / to open terminal</span>
    </div>
  );
  return (
    <div style={{ position:'fixed', inset:0, zIndex:500, background:'rgba(10,26,46,0.72)', backdropFilter:'blur(4px)', display:'flex', alignItems:'flex-end' }} onClick={e => { if (e.target===e.currentTarget) setOpen(false); }}>
      <div style={{ width:'100%', maxWidth:700, margin:'0 auto', background:'#060d16', borderTop:'2px solid var(--accent)', borderLeft:'1px solid rgba(240,235,226,0.06)', borderRight:'1px solid rgba(240,235,226,0.06)', borderRadius:'4px 4px 0 0', display:'flex', flexDirection:'column', maxHeight:'54vh', boxShadow:'0 -24px 64px rgba(0,0,0,0.65)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 16px', borderBottom:'1px solid rgba(240,235,226,0.06)' }}>
          <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, color:'var(--accent)', letterSpacing:'0.14em', textTransform:'uppercase' }}>terminal · toby@portfolio</span>
          <button onClick={() => setOpen(false)} style={{ background:'none', border:'none', cursor:'none', fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:'var(--fg-muted)', padding:'0 4px' }}>esc ×</button>
        </div>
        <div ref={outRef} style={{ flex:1, overflowY:'auto', padding:'12px 16px', fontFamily:"'JetBrains Mono',monospace", fontSize:11, lineHeight:1.85 }}>
          {hist.map((l,i) => (
            <div key={i} style={{ color: l.s?'var(--accent)':l.p?'var(--fg-bright)':l.e?'#ff6b5b':'var(--fg-muted)', minHeight: l.t===''?6:'auto' }}>
              {l.p && <span style={{ color:'rgba(62,207,178,0.38)', marginRight:8 }}>~$</span>}
              {l.t}
            </div>
          ))}
        </div>
        <div style={{ padding:'6px 16px 10px', borderTop:'1px solid rgba(240,235,226,0.06)', display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:'rgba(62,207,178,0.38)' }}>~$</span>
          <input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')run(input);if(e.key==='Escape')setOpen(false);}} style={{ flex:1, background:'transparent', border:'none', outline:'none', fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:'var(--fg-bright)', caretColor:'var(--accent)', cursor:'text' }} placeholder="type a command…" spellCheck={false} autoComplete="off" />
        </div>
      </div>
    </div>
  );
}

function Hero({ blog }) {
  // Split title at first space to colour the second word coral, falling back if single word
  const parts = blog.title.split(' ');
  const head = parts.slice(0, -1).join(' ');
  const tail = parts[parts.length - 1];
  return (
    <section id="hero" style={{ minHeight:'72vh', display:'flex', flexDirection:'column', justifyContent:'flex-end' }}>
      <div className="sect-label reveal">WRITING · INDEX</div>
      <h1 className="reveal d1" style={{ fontFamily:"'Fraunces',serif", fontWeight:300, fontSize:'clamp(56px,8vw,128px)', lineHeight:0.94, letterSpacing:'-0.025em', color:'var(--fg-bright)', marginBottom:24 }}>
        {head ? <>{head} <em style={{ fontStyle:'italic', color:'var(--secondary-accent)' }}>{tail}</em></> : <em style={{ fontStyle:'italic', color:'var(--secondary-accent)' }}>{tail}</em>}
      </h1>
      <p className="reveal d2" style={{ fontFamily:"'Fraunces',serif", fontStyle:'italic', fontWeight:300, fontSize:'var(--fs-xl)', color:'var(--fg-muted)', maxWidth:640, lineHeight:1.5 }}>
        {blog.intro}
      </p>
    </section>
  );
}

function Featured({ posts }) {
  const p = posts.find(x => x.featured) || posts[0];
  if (!p) return null;
  return (
    <section id="featured">
      <div className="sect-label reveal">FEATURED</div>
      <a href={`/article?slug=${p.slug}`} className="reveal d1 hoverable" style={{ display:'block', background:'#ff6b5b', borderRadius:'var(--r-md)', padding:'42px 38px', textDecoration:'none', position:'relative', overflow:'hidden' }}>
        <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, textTransform:'uppercase', letterSpacing:'0.14em', color:'rgba(13,31,53,0.65)', marginBottom:24 }}>{p.date} · {p.read} read</div>
        <h2 style={{ fontFamily:"'Fraunces',serif", fontWeight:300, fontSize:'clamp(38px,4.6vw,68px)', lineHeight:1.02, letterSpacing:'-0.02em', color:'#0a1a2e', marginBottom:22, maxWidth:780 }}>{p.title}</h2>
        <p style={{ fontFamily:"'DM Sans',sans-serif", fontWeight:300, fontSize:'var(--fs-md)', lineHeight:1.6, color:'rgba(13,31,53,0.78)', maxWidth:600, marginBottom:28 }}>{p.sub}</p>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', flexWrap:'wrap', gap:16 }}>
          <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
            {(p.tags||[]).map(t=>(<span key={t} style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, textTransform:'uppercase', letterSpacing:'0.12em', padding:'3px 9px', borderRadius:'var(--r-sm)', border:'1px solid rgba(13,31,53,0.28)', color:'#0a1a2e' }}>{t}</span>))}
          </div>
          <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, textTransform:'uppercase', letterSpacing:'0.14em', color:'#0a1a2e' }}>Read essay →</span>
        </div>
      </a>
    </section>
  );
}

function Index({ posts, tags, outro }) {
  const [activeTag, setActiveTag] = useState('All');
  const [hovDate, setHovDate] = useState({});
  const timers = useRef({});
  const startType = (i, date) => {
    let c = 0;
    clearInterval(timers.current[i]);
    setHovDate(h => ({ ...h, [i]: '' }));
    timers.current[i] = setInterval(() => {
      c++;
      setHovDate(h => ({ ...h, [i]: date.slice(0, c) }));
      if (c >= date.length) clearInterval(timers.current[i]);
    }, 38);
  };
  const stopType = (i) => { clearInterval(timers.current[i]); setHovDate(h => ({ ...h, [i]: undefined })); };
  const filtered = posts.filter(p => !p.featured && (activeTag==='All' || (p.tags||[]).includes(activeTag)));
  return (
    <section id="index" style={{ borderTop:'1px solid var(--border)' }}>
      <div className="sect-label reveal">ALL WRITING</div>
      <div className="reveal d1" style={{ display:'flex', flexWrap:'wrap', gap:8, marginBottom:32 }}>
        {tags.map(t => {
          const on = t === activeTag;
          return (
            <button key={t} onClick={()=>setActiveTag(t)} className="hoverable" style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, textTransform:'uppercase', letterSpacing:'0.12em', padding:'6px 12px', borderRadius:'var(--r-pill)', border:`1px solid ${on?'var(--accent)':'var(--border)'}`, background: on?'rgba(62,207,178,0.12)':'transparent', color: on?'var(--accent)':'var(--fg-muted)', cursor:'none', transition:'all var(--dur-base)' }}>{t}</button>
          );
        })}
      </div>
      <div className="reveal d2">
        {filtered.length === 0 && (
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:'var(--fg-faint)', padding:'40px 0', letterSpacing:'0.1em', textTransform:'uppercase' }}>No posts under "{activeTag}" yet.</div>
        )}
        {filtered.map((p,i)=>(
          <a key={p.slug} href={`/article?slug=${p.slug}`} className="post-row hoverable" onMouseEnter={()=>startType(i,p.date)} onMouseLeave={()=>stopType(i)} style={{ display:'flex', textDecoration:'none' }}>
            <span className="post-date">{hovDate[i] !== undefined ? hovDate[i] + (hovDate[i]?.length < p.date.length ? '▌' : '') : p.date}</span>
            <div style={{ flex:1 }}>
              <div className="post-title">{p.title}</div>
              <div style={{ fontFamily:"'DM Sans',sans-serif", fontWeight:300, fontSize:'var(--fs-sm)', color:'var(--fg-muted)', marginTop:6, lineHeight:1.6, maxWidth:620 }}>{p.sub}</div>
              <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginTop:12 }}>
                {(p.tags||[]).map(t=>(<span key={t} style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:8.5, textTransform:'uppercase', letterSpacing:'0.1em', padding:'2px 8px', borderRadius:'var(--r-sm)', border:'1px solid var(--border)', color:'var(--fg-muted)' }}>{t}</span>))}
              </div>
            </div>
            <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:'var(--fg-faint)', alignSelf:'flex-start', marginLeft:16, letterSpacing:'0.08em' }}>{p.read}</span>
          </a>
        ))}
      </div>
      <div style={{ marginTop:48, paddingTop:32, borderTop:'1px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:16 }}>
        <a href="/" className="hoverable" style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, textTransform:'uppercase', letterSpacing:'0.12em', color:'#0a1a2e', background:'var(--accent)', padding:'11px 20px', borderRadius:'var(--r-md)', textDecoration:'none', display:'inline-flex', alignItems:'center', gap:8, transition:'background var(--dur-base)' }} onMouseEnter={e=>e.currentTarget.style.background='var(--accent-hover)'} onMouseLeave={e=>e.currentTarget.style.background='var(--accent)'}><span>←</span> Back to portfolio</a>
        <span style={{ fontFamily:"'Fraunces',serif", fontStyle:'italic', fontWeight:300, fontSize:'var(--fs-md)', color:'var(--fg-muted)' }}>{outro || "That's everything for now."}</span>
      </div>
    </section>
  );
}

function App() {
  const [data, setData] = useState(null);
  useEffect(() => {
    Promise.all([
      fetch('content/site.json').then(r => r.json()),
      fetch('content/posts.json').then(r => r.json()),
    ]).then(([site, posts]) => {
      setData({ site, posts: posts.posts });
    }).catch(err => console.error('Content load failed:', err));
  }, []);
  if (!data) return <div style={{ position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:'var(--fg-muted)', letterSpacing:'0.14em', textTransform:'uppercase' }}>loading…</div>;
  return (
    <>
      <Terminal />
      <SidebarNav />
      <ThemeToggle />
      <FloatingMenu current="articles" />
      <div className="page">
        <Hero blog={data.site.blog} />
        <Featured posts={data.posts} />
        <Index posts={data.posts} tags={data.site.blog.tags} outro={data.site.blog.outro} />
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
const cursor = document.getElementById('cursor');
let tx = -100, ty = -100, cx = -100, cy = -100;
(function tick() {
  cx += (tx - cx) * 0.4;
  cy += (ty - cy) * 0.4;
  cursor.style.left = cx + 'px';
  cursor.style.top  = cy + 'px';
  requestAnimationFrame(tick);
})();
document.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
document.addEventListener('mouseover', e => {
  cursor.classList.toggle('large', !!e.target.closest('a,button,.hoverable'));
});

const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('shown'); io.unobserve(e.target); } });
}, { threshold: 0.08 });
const attachReveals = () => document.querySelectorAll('.reveal:not(.shown)').forEach(el => io.observe(el));
attachReveals();
setTimeout(attachReveals, 500);
</script>
</body>
</html>
